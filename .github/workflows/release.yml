name: Publish release

on:
  push:
    branches: [main]
    paths: [VERSION]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install nodriver==0.48.1 python-dotenv
      - name: Verify scripts and regression tests
        run: |
          bash -n entrypoint.sh run-nas.sh run-scheduler.sh
          node --version
          python -m unittest discover -s tests -v
      - name: Build public archive
        run: python build_release.py
      - name: Publish version and downloadable files
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION)
          gh release create "v${VERSION}" \
            "dist/2dfan-auto-checkin-v${VERSION}.zip" dist/SHA256SUMS.txt \
            --target "$GITHUB_SHA" --title "2dfan Auto Check-in v${VERSION}" \
            --notes-file RELEASE_NOTES.md
